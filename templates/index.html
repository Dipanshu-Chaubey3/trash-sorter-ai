<!DOCTYPE html>
<html>
<head>
    <title>Eco-Sort AI</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #e8f5e9; text-align: center; color: #2e7d32; }
        .box { background: white; max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 25px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .btn { background: #4caf50; color: white; padding: 12px 25px; border: none; border-radius: 50px; cursor: pointer; font-size: 1.1em; }
        .bin-tag { font-size: 1.5em; font-weight: bold; margin: 20px 0; padding: 10px; border-radius: 10px; border: 2px solid #4caf50; }
        img { border-radius: 15px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>♻️ Eco-Sort AI</h1>
        <p>Scan your trash to find the right bin!</p>
        <form action="/sort" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <br><br>
            <button type="submit" class="btn">Analyze & Sort</button>
        </form>

        {% if result %}
            <div class="result-area">
                <img src="/static/{{ image }}" width="300">
                <p>Identified: <strong>{{ result.item }}</strong></p>
                <div class="bin-tag">{{ result.bin }}</div>
                <p>Accuracy: {{ result.confidence }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
